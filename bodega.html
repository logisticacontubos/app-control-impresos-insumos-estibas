<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodega · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="modulo.html">&#8592;</a>
    <div>
      <h1 id="titulo">Bodega</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="info-msg" id="toastExito" style="display:none;"></div>
    <p style="font-size:12px;color:var(--gris);margin:0 0 8px;">Cola de pendientes</p>
    <div id="pendientes"></div>

    <div id="seccionDevoluciones" style="display:none;">
      <p style="font-size:12px;color:var(--gris);margin:20px 0 8px;">Registrar devolución</p>
      <div id="entregadas"></div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod } = ctx;
    document.getElementById("backLink").href = "modulo.html?modulo=" + mod.key;
    document.getElementById("titulo").textContent = "Bodega";
    document.getElementById("sub").textContent = mod.label;

    // Mapa código (sin espacios, sin mayúsculas) -> stock actual, para mostrar
    // cuánto hay disponible justo al momento de entregar, sin tener que salir
    // a mirar la pantalla de Inventario. Se arma con el mismo filtro de
    // empresa que ya usa el resto de la pantalla, así que funciona igual en
    // Contubos y en Tecnipapel, y en los tres módulos.
    function claveCodigo(c) { return String(c || "").trim().toLowerCase(); }

    async function cargar() {
      // Una sola llamada combinada (requisiciones + inventario juntos) en vez
      // de 2 llamadas simultáneas — pedir 2 cosas al mismo tiempo a Apps
      // Script puede chocar con el límite de ejecuciones simultáneas de
      // Google y hacer que una de las 2 falle o se quede pegada.
      const datos = await apiGet("getBodegaDatos", { modulo: mod.key });
      const items = datos.requisiciones || [];
      const pendientes = items.filter((r) => r.Estado === "Pendiente" || r.Estado === "Entregado parcial");
      const entregadas = mod.hasDevolucion ? items.filter((r) => r.Estado === "Entregado") : [];

      const stockPorCodigo = {};
      (datos.inventario || []).forEach((it) => {
        const codigoHeader = buscarEncabezado(it, "Código");
        const stockHeader = buscarEncabezado(it, "Stock actual");
        if (codigoHeader && stockHeader) stockPorCodigo[claveCodigo(it[codigoHeader])] = it[stockHeader];
      });

      const contPend = document.getElementById("pendientes");
      contPend.innerHTML = pendientes.length === 0
        ? '<p style="font-size:13px;color:var(--gris);">No hay requisiciones pendientes.</p>'
        : pendientes.map((r) => {
            const cantSolHeader = buscarEncabezado(r, "Cantidad solicitada");
            const cantEntHeader = buscarEncabezado(r, "Cantidad entregada");
            const solicitada = Number(r[cantSolHeader]) || 0;
            const entregada = Number(r[cantEntHeader]) || 0;
            const saldo = Math.max(0, solicitada - entregada);
            const disponible = stockPorCodigo[claveCodigo(r["Código"])];
            const hayDisponible = disponible !== undefined && disponible !== "" && disponible !== null;
            return `
            <div class="req-item" id="req-${r.ID}">
              <div class="fila"><span class="reqid">${r.ID}</span><span class="badge badge-${claseEstado(r.Estado)}">${r.Estado}</span></div>
              <p class="op" style="font-weight:600;">${r["Referencia"]}</p>
              ${detalleRequisicion(r, mod)}
              ${hayDisponible ? `<p style="font-size:12px;color:var(--gris);margin:0 0 8px;">Disponible en inventario: <strong style="color:var(--texto);">${disponible} ${mod.unitLabel}</strong></p>` : ""}
              <form onsubmit="return entregar(event, '${r.ID}')">
                <input type="number" placeholder="Cantidad entregada (${mod.unitLabel})${r.Estado === "Entregado parcial" ? " · faltan " + saldo : ""}" class="inp-cant" step="0.01" min="0" required>
                <input type="text" placeholder="Operario de producción que recibe" class="inp-recibe" required>
                <button class="btn btn-primary">Entregar</button>
              </form>
            </div>`;
          }).join("");

      if (mod.hasDevolucion) {
        document.getElementById("seccionDevoluciones").style.display = "";
        const contEnt = document.getElementById("entregadas");
        contEnt.innerHTML = entregadas.length === 0
          ? '<p style="font-size:13px;color:var(--gris);">No hay requisiciones entregadas.</p>'
          : entregadas.map((r) => `
            <div class="req-item">
              <div class="fila"><span class="reqid">${r.ID}</span><span class="badge badge-Entregado">Entregado</span></div>
              <p class="op" style="font-weight:600;">${r["Referencia"]}</p>
              ${detalleRequisicion(r, mod)}
              <form onsubmit="return devolver(event, '${r.ID}')">
                <input type="number" placeholder="Kg devuelto" class="inp-cant" step="0.01" min="0" required>
                <input type="text" placeholder="Quién devuelve (producción)" class="inp-quien" required>
                <button class="btn btn-primary">Registrar devolución</button>
              </form>
            </div>`).join("");
      }

      // Si se llegó aquí con un enlace directo desde "Cola de pendientes" en
      // modulo.html (ej: bodega.html#req-INS-0005), lleva la vista hasta esa
      // requisición y la resalta un momento para que se note cuál es.
      if (window.location.hash) {
        const destino = document.querySelector(window.location.hash);
        if (destino) {
          destino.scrollIntoView({ behavior: "smooth", block: "center" });
          destino.style.boxShadow = "0 0 0 3px var(--magenta)";
          setTimeout(() => { destino.style.boxShadow = ""; }, 2200);
        }
      }
    }
    cargar();

    window.entregar = async function (e, id) {
      e.preventDefault();
      const form = e.target;
      const cantidadEntregada = form.querySelector(".inp-cant").value;
      const entregadoA = form.querySelector(".inp-recibe").value;
      try {
        const res = await apiPost("entregarRequisicion", { modulo: mod.key, id, cantidadEntregada, entregadoA, entrego: usuario.nombre });
        if (res && res.estado === "Entregado parcial") {
          mostrarToast(`Entrega parcial registrada · faltan ${res.saldoPendiente} ${mod.unitLabel}`, 3200);
        } else {
          mostrarToast("Requisición entregada completa");
        }
        if (res && res.advertenciaStock) alert(res.advertenciaStock);
        cargar();
      } catch (err) { alert(err.message); }
      return false;
    };

    window.devolver = async function (e, id) {
      e.preventDefault();
      const form = e.target;
      const cantidadDevuelta = form.querySelector(".inp-cant").value;
      const quienDevuelve = form.querySelector(".inp-quien").value;
      try {
        await apiPost("devolverRequisicion", { modulo: mod.key, id, cantidadDevuelta, quienDevuelve, recibio: usuario.nombre });
        cargar();
      } catch (err) { alert(err.message); }
      return false;
    };
  }
</script>
</body>
</html>
