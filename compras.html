<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista de compras · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  header.topbar > div.logos-dobles{display:flex;align-items:center;gap:6px;flex:0 0 auto;min-width:auto;}
  .logos-dobles img{height:20px;width:auto;object-fit:contain;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="home.html">&#8592;</a>
    <div>
      <h1>Vista de compras</h1>
      <p class="sub">Impresos · Insumos · Materia Prima</p>
    </div>
    <div class="logos-dobles">
      <img src="assets/logo-contubos.png" alt="Contubos">
      <img src="assets/logo-tecnipapel.png" alt="Tecnipapel">
    </div>
  </header>
  <main>
    <div class="chip-row" id="chipsModulo"></div>
    <div class="chip-row" id="chipsEmpresa" style="display:none;"></div>
    <div id="lista"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
const usuario = requiereSesion();

// Vista de compras: junta Impresos + Insumos + Materia Prima en una sola
// pantalla, SIN necesidad de entrar a un módulo específico ni de cambiar de
// empresa para ver "lo que tiene cada una". Es de SOLO LECTURA — no permite
// modificar nada del inventario ni de los umbrales (Óptimo/Ajustado/Crítico
// se muestran como referencia, no como campos editables). Estibas queda
// afuera a propósito: ese inventario todavía no está completo ni
// funcionando (igual que en el resto de la app).
const MODULOS_COMPRAS = ["impresos", "insumos", "materiaPrima"];

// Más crítico arriba, más óptimo abajo — así lo primero que ve compras es
// lo más urgente, sin tener que leer tarjeta por tarjeta. "Cero" (stock
// actual en cero) va primero de todos, antes que Crítico.
const ORDEN_CRITICIDAD = { "Cero": 0, "Crítico": 1, "Ajustado": 2, "Óptimo": 3 };
function claseSugerido(estado) {
  if (estado === "Crítico" || estado === "Cero") return "sug-critico";
  if (estado === "Ajustado") return "sug-ajustado";
  return "sug-optimo";
}

if (usuario) {
  if (["compras", "bodega", "admin"].indexOf(usuario.rol) === -1) {
    window.location.href = "home.html";
  } else {
    mostrarUsuarioEnHeader(usuario);
    mostrarBotonActualizar();
    mostrarBotonSalir();

    // El rol de Compras entra directo a esta pantalla (home.html lo manda
    // aquí apenas hace login) y no tiene otra pantalla de Inicio a la cual
    // volver, así que no tiene sentido mostrarle la flecha de "atrás".
    if (usuario.rol === "compras") {
      document.getElementById("backLink").style.display = "none";
    }

    // Solo los módulos a los que este usuario tiene acceso (un usuario de
    // "Ambas" empresas los ve los 3; uno de una sola empresa solo ve los que
    // le aplican, igual que en el resto de la app).
    const modulosDisponibles = MODULOS_COMPRAS
      .map((k) => MODULOS[k])
      .filter((m) => puedeAccederModulo(usuario, m.key));

    let moduloActivo = modulosDisponibles[0];
    let empresaActiva = "todos";

    function renderChipsModulo() {
      document.getElementById("chipsModulo").innerHTML = modulosDisponibles.map((m) => `
        <span class="chip ${m.key === moduloActivo.key ? "on" : ""}" onclick="cambiarModulo('${m.key}')">${m.label}</span>
      `).join("");
    }

    // El chip de empresa solo aparece cuando el módulo activo de verdad
    // maneja las dos empresas (Insumos) Y este usuario puede ver ambas — en
    // Impresos (solo Contubos) o Materia Prima (solo Tecnipapel) no hay nada
    // que elegir, y a un usuario de una sola empresa tampoco hay que
    // mostrarle un selector que no necesita.
    function renderChipsEmpresa() {
      const cont = document.getElementById("chipsEmpresa");
      const disponibles = empresasParaUsuario(usuario, moduloActivo.key);
      if (disponibles.length < 2) {
        cont.style.display = "none";
        empresaActiva = disponibles[0] || "todos";
        return;
      }
      cont.style.display = "flex";
      const opciones = [{ v: "todos", l: "Todas las empresas" }].concat(
        disponibles.map((e) => ({ v: e, l: e }))
      );
      if (!opciones.some((o) => o.v === empresaActiva)) empresaActiva = "todos";
      cont.innerHTML = opciones.map((o) => `
        <span class="chip ${o.v === empresaActiva ? "on" : ""}" onclick="cambiarEmpresa('${o.v}')">${o.l}</span>
      `).join("");
    }

    window.cambiarModulo = function (key) {
      moduloActivo = MODULOS[key];
      empresaActiva = "todos";
      renderChipsModulo();
      renderChipsEmpresa();
      cargar();
    };
    window.cambiarEmpresa = function (e) {
      empresaActiva = e;
      renderChipsEmpresa();
      cargar();
    };

    async function cargar() {
      const cont = document.getElementById("lista");
      cont.innerHTML = '<p class="loading">Cargando...</p>';
      const empresaParam = empresaActiva === "todos" ? "" : empresaActiva;
      // empresa se pasa siempre explícita (aunque sea "") para que esta
      // pantalla no herede la "empresa activa" que usan las demás pantallas
      // de módulo (sessionStorage) — Vista de compras maneja su propio
      // filtro de empresa, independiente de eso.
      const data = await apiGet("getInventario", { modulo: moduloActivo.key, empresa: empresaParam });
      const items = data.items || [];

      if (items.length === 0) {
        cont.innerHTML = '<p style="font-size:13px;color:var(--gris);text-align:center;padding:24px 0;">No hay ítems en este filtro.</p>';
        return;
      }

      const codigoHeader = buscarEncabezado(items[0], "Código");
      const refHeader = buscarEncabezado(items[0], "Referencia");
      const stockHeader = buscarEncabezado(items[0], "Stock actual");
      const sugeridoHeader = buscarEncabezado(items[0], "Sugerido");

      const itemsOrdenados = items.slice().sort((a, b) =>
        (ORDEN_CRITICIDAD[a["Estado"]] ?? 2) - (ORDEN_CRITICIDAD[b["Estado"]] ?? 2)
      );

      // Siempre se muestran TODOS los ítems del inventario del módulo (igual
      // que "Ver inventario"), tengan o no algo sugerido a pedir — a los que
      // no les hace falta nada se les marca "No hace falta" en vez de
      // ocultarlos. Óptimo/Ajustado/Crítico van de solo lectura, como
      // referencia chica — esta vista no modifica nada.
      cont.innerHTML = itemsOrdenados.map((it) => {
        const codigo = codigoHeader ? (it[codigoHeader] || "") : "";
        const empresaItem = moduloActivo.empresas.length > 1 ? (it["Empresa"] || "Ambas") : moduloActivo.empresas[0];
        const sugerido = sugeridoHeader ? (Number(it[sugeridoHeader]) || 0) : 0;
        const campos = ["Óptimo", "Ajustado", "Crítico"].map((f) => {
          const h = buscarEncabezado(it, f);
          if (!h) return "";
          return `<div class="u">${f}<b>${it[h]}</b></div>`;
        }).join("");
        return `
          <div class="req-item">
            <div class="fila">
              <div>
                <div class="reqid">${it[refHeader]}</div>
                <div class="codigo-item">${codigo}<span class="sep"> · ${moduloActivo.label} · ${empresaItem}</span></div>
              </div>
              <span class="badge badge-${claseEstado(it["Estado"])}">${it["Estado"]}</span>
            </div>
            <div class="stats-principales">
              <div class="stat-principal stock">
                <p class="l">Stock actual</p>
                <p class="v">${it[stockHeader]} ${moduloActivo.unitLabel}</p>
              </div>
              <div class="stat-principal sugerido ${claseSugerido(it["Estado"])}">
                <p class="l">Sugerido a pedir</p>
                <p class="v ${sugerido === 0 ? "cero" : ""}">${sugerido === 0 ? "No hace falta" : sugerido + " " + moduloActivo.unitLabel}</p>
              </div>
            </div>
            <div class="umbrales-mini">${campos}</div>
          </div>`;
      }).join("");
    }

    renderChipsModulo();
    renderChipsEmpresa();
    cargar();
  }
}
</script>
</body>
</html>
