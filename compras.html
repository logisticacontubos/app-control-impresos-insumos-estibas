<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista de compras · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  header.topbar > div.logos-dobles{display:flex;align-items:center;gap:6px;flex:0 0 auto;min-width:auto;}
  .logos-dobles img{height:20px;width:auto;object-fit:contain;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar no-imprimir">
    <a class="back" id="backLink" href="home.html">&#8592;</a>
    <div>
      <h1>Vista de compras</h1>
      <p class="sub">Impresos · Insumos · Materia Prima</p>
    </div>
    <div class="logos-dobles">
      <img src="assets/logo-contubos.png" alt="Contubos">
      <img src="assets/logo-tecnipapel.png" alt="Tecnipapel">
    </div>
  </header>
  <main>
    <!-- Encabezado propio del reporte (Excel/PDF) — igual al de Reporte y
         KPI's, pero con los dos logos porque esta vista junta las dos
         empresas. Solo se ve al imprimir/exportar, nunca en pantalla. -->
    <div class="encabezado-pdf solo-impresion">
      <img id="logoPdfContubos" src="assets/logo-contubos.png" alt="Contubos" style="height:30px;">
      <img id="logoPdfTecnipapel" src="assets/logo-tecnipapel.png" alt="Tecnipapel" style="height:30px;margin-left:-10px;">
      <div class="txt">
        <h2>Reporte · Vista de compras</h2>
        <p id="subPdf"></p>
      </div>
    </div>

    <div class="chip-row no-imprimir" id="chipsModulo"></div>
    <div class="chip-row no-imprimir" id="chipsEmpresa" style="display:none;"></div>

    <div class="btn-row no-imprimir" style="margin-bottom:14px;">
      <button class="btn btn-secondary" id="btnExcel">Descargar Excel</button>
      <button class="btn btn-secondary" id="btnPdf">Descargar PDF</button>
    </div>

    <div id="lista" class="no-imprimir"></div>

    <!-- Tabla de solo-impresión: el reporte trae SIEMPRE el filtro que esté
         activo en pantalla (el módulo y la empresa elegidos con los chips de
         arriba) — es "el reporte actual", no todo el inventario completo. -->
    <div class="solo-impresion" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead>
          <tr style="text-align:left;">
            <th style="padding:6px 7px;border:1px solid var(--borde);">Código</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Referencia</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Empresa</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Estado</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Stock actual</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Sugerido a pedir</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Óptimo</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Ajustado</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Crítico</th>
          </tr>
        </thead>
        <tbody id="tbodyImpresion"></tbody>
      </table>
    </div>

    <div class="pie-pdf solo-impresion" id="piePdf"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
<script>
const usuario = requiereSesion();

// Vista de compras: junta Impresos + Insumos + Materia Prima en una sola
// pantalla, SIN necesidad de entrar a un módulo específico ni de cambiar de
// empresa para ver "lo que tiene cada una". Es de SOLO LECTURA — no permite
// modificar nada del inventario ni de los umbrales (Óptimo/Ajustado/Crítico
// se muestran como referencia, no como campos editables). Estibas queda
// afuera a propósito: ese inventario todavía no está completo ni
// funcionando (igual que en el resto de la app).
const MODULOS_COMPRAS = ["impresos", "insumos", "materiaPrima"];

// Más crítico arriba, más óptimo abajo — así lo primero que ve compras es
// lo más urgente, sin tener que leer tarjeta por tarjeta. "Cero" (stock
// actual en cero) va primero de todos, antes que Crítico.
const ORDEN_CRITICIDAD = { "Cero": 0, "Crítico": 1, "Ajustado": 2, "Óptimo": 3 };
function claseSugerido(estado) {
  if (estado === "Crítico" || estado === "Cero") return "sug-critico";
  if (estado === "Ajustado") return "sug-ajustado";
  return "sug-optimo";
}

if (usuario) {
  if (["compras", "bodega", "admin"].indexOf(usuario.rol) === -1) {
    window.location.href = "home.html";
  } else {
    mostrarUsuarioEnHeader(usuario);
    mostrarBotonActualizar();
    mostrarBotonSalir();

    // El rol de Compras entra directo a esta pantalla (home.html lo manda
    // aquí apenas hace login) y no tiene otra pantalla de Inicio a la cual
    // volver, así que no tiene sentido mostrarle la flecha de "atrás".
    if (usuario.rol === "compras") {
      document.getElementById("backLink").style.display = "none";
    }

    // Solo los módulos a los que este usuario tiene acceso (un usuario de
    // "Ambas" empresas los ve los 3; uno de una sola empresa solo ve los que
    // le aplican, igual que en el resto de la app).
    const modulosDisponibles = MODULOS_COMPRAS
      .map((k) => MODULOS[k])
      .filter((m) => puedeAccederModulo(usuario, m.key));

    let moduloActivo = modulosDisponibles[0];
    let empresaActiva = "todos";

    function renderChipsModulo() {
      document.getElementById("chipsModulo").innerHTML = modulosDisponibles.map((m) => `
        <span class="chip ${m.key === moduloActivo.key ? "on" : ""}" onclick="cambiarModulo('${m.key}')">${m.label}</span>
      `).join("");
    }

    // El chip de empresa solo aparece cuando el módulo activo de verdad
    // maneja las dos empresas (Insumos) Y este usuario puede ver ambas — en
    // Impresos (solo Contubos) o Materia Prima (solo Tecnipapel) no hay nada
    // que elegir, y a un usuario de una sola empresa tampoco hay que
    // mostrarle un selector que no necesita.
    function renderChipsEmpresa() {
      const cont = document.getElementById("chipsEmpresa");
      const disponibles = empresasParaUsuario(usuario, moduloActivo.key);
      if (disponibles.length < 2) {
        cont.style.display = "none";
        empresaActiva = disponibles[0] || "todos";
        return;
      }
      cont.style.display = "flex";
      const opciones = [{ v: "todos", l: "Todas las empresas" }].concat(
        disponibles.map((e) => ({ v: e, l: e }))
      );
      if (!opciones.some((o) => o.v === empresaActiva)) empresaActiva = "todos";
      cont.innerHTML = opciones.map((o) => `
        <span class="chip ${o.v === empresaActiva ? "on" : ""}" onclick="cambiarEmpresa('${o.v}')">${o.l}</span>
      `).join("");
    }

    window.cambiarModulo = function (key) {
      moduloActivo = MODULOS[key];
      empresaActiva = "todos";
      renderChipsModulo();
      renderChipsEmpresa();
      cargar();
    };
    window.cambiarEmpresa = function (e) {
      empresaActiva = e;
      renderChipsEmpresa();
      cargar();
    };

    // Datos del último "cargar()" — los usan tanto la tabla de impresión como
    // los botones de Excel/PDF, para que el reporte sea siempre justo lo que
    // está viendo compras en pantalla en ese momento (el módulo y la empresa
    // elegidos con los chips), no todo el inventario completo.
    let ultimosItems = [];
    let ultimoUnitLabel = "";

    async function cargar() {
      const cont = document.getElementById("lista");
      cont.innerHTML = '<p class="loading">Cargando...</p>';
      const empresaParam = empresaActiva === "todos" ? "" : empresaActiva;
      // empresa se pasa siempre explícita (aunque sea "") para que esta
      // pantalla no herede la "empresa activa" que usan las demás pantallas
      // de módulo (sessionStorage) — Vista de compras maneja su propio
      // filtro de empresa, independiente de eso.
      const data = await apiGet("getInventario", { modulo: moduloActivo.key, empresa: empresaParam });
      const items = data.items || [];
      ultimoUnitLabel = moduloActivo.unitLabel;

      document.getElementById("subPdf").textContent =
        moduloActivo.label + " · " + (empresaActiva === "todos" ? "Todas las empresas" : empresaActiva) +
        " · generado " + fechaHoy() + " " + horaActual();
      // El encabezado del reporte trae el logo de la empresa que de verdad
      // está filtrada: si el reporte es solo de Contubos o solo de
      // Tecnipapel, sale un único logo (no tiene sentido poner los dos si el
      // reporte no trae nada de la otra); si es de las dos empresas juntas
      // (o el módulo es de una sola, como Impresos/Materia Prima), salen
      // ambos o el que corresponda.
      document.getElementById("logoPdfContubos").style.display = empresaActiva === "Tecnipapel" ? "none" : "";
      document.getElementById("logoPdfTecnipapel").style.display = empresaActiva === "Contubos" ? "none" : "";
      document.getElementById("piePdf").textContent =
        "Generado por " + usuario.nombre + " (" + (usuario.cargo || usuario.rol) + ") · " + fechaHoy() + " " + horaActual() + " · " + window.location.hostname;

      if (items.length === 0) {
        cont.innerHTML = '<p style="font-size:13px;color:var(--gris);text-align:center;padding:24px 0;">No hay ítems en este filtro.</p>';
        document.getElementById("tbodyImpresion").innerHTML =
          `<tr><td colspan="9" style="padding:10px;border:1px solid var(--borde);color:var(--gris);">No hay ítems en este filtro.</td></tr>`;
        ultimosItems = [];
        return;
      }

      const codigoHeader = buscarEncabezado(items[0], "Código");
      const refHeader = buscarEncabezado(items[0], "Referencia");
      const stockHeader = buscarEncabezado(items[0], "Stock actual");
      const sugeridoHeader = buscarEncabezado(items[0], "Sugerido");

      const itemsOrdenados = items.slice().sort((a, b) =>
        (ORDEN_CRITICIDAD[a["Estado"]] ?? 2) - (ORDEN_CRITICIDAD[b["Estado"]] ?? 2)
      );

      // Siempre se muestran TODOS los ítems del inventario del módulo (igual
      // que "Ver inventario"), tengan o no algo sugerido a pedir — a los que
      // no les hace falta nada se les marca "No hace falta" en vez de
      // ocultarlos. Óptimo/Ajustado/Crítico van de solo lectura, como
      // referencia chica — esta vista no modifica nada.
      ultimosItems = itemsOrdenados.map((it) => {
        const h = (f) => buscarEncabezado(it, f);
        return {
          codigo: codigoHeader ? (it[codigoHeader] || "") : "",
          referencia: it[refHeader],
          empresa: moduloActivo.empresas.length > 1 ? (it["Empresa"] || "Ambas") : moduloActivo.empresas[0],
          estado: it["Estado"],
          stock: it[stockHeader],
          sugerido: sugeridoHeader ? (Number(it[sugeridoHeader]) || 0) : 0,
          optimo: h("Óptimo") ? it[h("Óptimo")] : "",
          ajustado: h("Ajustado") ? it[h("Ajustado")] : "",
          critico: h("Crítico") ? it[h("Crítico")] : "",
        };
      });

      cont.innerHTML = ultimosItems.map((it) => `
          <div class="req-item">
            <div class="fila">
              <div>
                <div class="reqid">${it.referencia}</div>
                <div class="codigo-item">${it.codigo}<span class="sep"> · ${moduloActivo.label} · ${it.empresa}</span></div>
              </div>
              <span class="badge badge-${claseEstado(it.estado)}">${it.estado}</span>
            </div>
            <div class="stats-principales">
              <div class="stat-principal stock">
                <p class="l">Stock actual</p>
                <p class="v">${it.stock} ${moduloActivo.unitLabel}</p>
              </div>
              <div class="stat-principal sugerido ${claseSugerido(it.estado)}">
                <p class="l">Sugerido a pedir</p>
                <p class="v ${it.sugerido === 0 ? "cero" : ""}">${it.sugerido === 0 ? "No hace falta" : it.sugerido + " " + moduloActivo.unitLabel}</p>
              </div>
            </div>
            <div class="umbrales-mini">
              <div class="u">Óptimo<b>${it.optimo}</b></div>
              <div class="u">Ajustado<b>${it.ajustado}</b></div>
              <div class="u">Crítico<b>${it.critico}</b></div>
            </div>
          </div>`).join("");

      const celda = (v) => `<td style="padding:6px 7px;border:1px solid var(--borde);">${v}</td>`;
      document.getElementById("tbodyImpresion").innerHTML = ultimosItems.map((it) => {
        const fondo = it.estado === "Crítico" || it.estado === "Cero" ? "var(--rojo-fondo)"
          : it.estado === "Ajustado" ? "var(--ambar-fondo)" : "var(--verde-fondo)";
        const color = it.estado === "Crítico" || it.estado === "Cero" ? "var(--rojo)"
          : it.estado === "Ajustado" ? "var(--ambar)" : "var(--verde)";
        const textoSugerido = it.sugerido === 0 ? "No hace falta" : it.sugerido + " " + moduloActivo.unitLabel;
        return "<tr>" +
          celda(it.codigo) + celda(it.referencia) + celda(it.empresa) + celda(it.estado) +
          celda(it.stock + " " + moduloActivo.unitLabel) +
          `<td style="padding:6px 7px;border:1px solid var(--borde);background:${fondo};color:${color};font-weight:700;">${textoSugerido}</td>` +
          celda(it.optimo) + celda(it.ajustado) + celda(it.critico) + "</tr>";
      }).join("");
    }

    document.getElementById("btnExcel").addEventListener("click", () => {
      if (ultimosItems.length === 0) return;
      const wb = XLSX.utils.book_new();
      const filas = [
        ["Reporte · Vista de compras", moduloActivo.label, empresaActiva === "todos" ? "Todas las empresas" : empresaActiva, fechaHoy()],
        [],
        ["Código", "Referencia", "Empresa", "Estado", "Stock actual", "Sugerido a pedir", "Óptimo", "Ajustado", "Crítico"],
        ...ultimosItems.map((it) => [
          it.codigo, it.referencia, it.empresa, it.estado,
          it.stock + " " + ultimoUnitLabel,
          it.sugerido === 0 ? "No hace falta" : it.sugerido + " " + ultimoUnitLabel,
          it.optimo, it.ajustado, it.critico,
        ]),
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filas), "Compras");
      XLSX.writeFile(wb, `Vista_de_compras_${moduloActivo.key}_${fechaHoy()}.xlsx`);
    });

    document.getElementById("btnPdf").addEventListener("click", () => window.print());

    renderChipsModulo();
    renderChipsEmpresa();
    cargar();
  }
}
</script>
</body>
</html>
