<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corte mensual de inventario · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="inventario.html">&#8592;</a>
    <div>
      <h1 id="titulo">Corte mensual de inventario</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="error-msg" id="errorMsg"></div>
    <div id="contenido"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod, empresaActual } = ctx;
    document.getElementById("backLink").href = "inventario.html?modulo=" + mod.key;
    document.getElementById("sub").textContent = mod.label + " · " + empresaActual;

    if (!puedeRegistrarCorte(usuario.rol)) {
      document.getElementById("contenido").innerHTML = '<p style="font-size:13px;color:var(--gris);margin-top:20px;">No tienes permiso para hacer el corte de inventario en este módulo.</p>';
    } else {
      let estado = null; // { loteId, unitLabel, totalItems, itemsContados, items: [...] }
      let filtroActivo = "todos";

      // Claves de intento (mismo mecanismo que en las demás pantallas): una
      // por ítem para "Guardar este ítem" — se guarda en un mapa por índice
      // porque aquí hay muchos ítems en la misma pantalla — y una sola para
      // "Finalizar corte", que es una acción única por lote.
      const idemPorItem = {};
      function idemItem(idx) {
        if (!idemPorItem[idx]) idemPorItem[idx] = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("idem-" + Date.now() + "-" + Math.random());
        return idemPorItem[idx];
      }
      let idemFinalizar = null;
      function idemParaFinalizar() {
        if (!idemFinalizar) idemFinalizar = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("idem-" + Date.now() + "-" + Math.random());
        return idemFinalizar;
      }

      // --- Calculadora por ítem --------------------------------------
      // Pensada primero para celular: botones grandes para tocar en vez de
      // depender del teclado del teléfono (que no siempre muestra bien los
      // signos +, -, *, /). Es JS propio, sin ninguna librería nueva, para
      // que la app no pese más. El estado (si está abierta y qué llevan
      // escrito) se guarda por índice de ítem y sobrevive a los repintados
      // de la pantalla mientras se cuenta.
      const calcState = {};
      function obtenerCalc(idx) {
        if (!calcState[idx]) calcState[idx] = { abierto: false, expr: "" };
        return calcState[idx];
      }

      // Evalúa sumas/multiplicaciones simples (+ - * / y paréntesis) sin
      // usar eval() — un parser chiquito propio para no traer ninguna
      // librería de cálculo solo para esto. Si lo escrito no es válido
      // todavía (p. ej. termina en un operador mientras se sigue tecleando)
      // devuelve null en vez de reventar, para que el total en pantalla
      // simplemente se quede esperando el siguiente número.
      function evaluarExpresion(expr) {
        let limpio = String(expr).replace(/\s+/g, "");
        limpio = limpio.replace(/[+\-*/.]+$/, "");
        if (limpio === "" || !/^[0-9+\-*/().]+$/.test(limpio)) return null;
        try {
          let i = 0;
          function numero() {
            if (limpio[i] === "+") i++; // "+" inicial suelto (p. ej. al pegar un comentario viejo que empezaba así)
            const inicio = i;
            if (limpio[i] === "-") i++;
            while (i < limpio.length && /[0-9.]/.test(limpio[i])) i++;
            if (i === inicio || (limpio[inicio] === "-" && i === inicio + 1)) throw new Error("num");
            return Number(limpio.slice(inicio, i));
          }
          function parentesis() {
            if (limpio[i] === "(") {
              i++;
              const v = suma();
              if (limpio[i] !== ")") throw new Error("parentesis");
              i++;
              return v;
            }
            return numero();
          }
          function multiplicacion() {
            let v = parentesis();
            while (limpio[i] === "*" || limpio[i] === "/") {
              const op = limpio[i]; i++;
              const d = parentesis();
              v = op === "*" ? v * d : v / d;
            }
            return v;
          }
          function suma() {
            let v = multiplicacion();
            while (limpio[i] === "+" || limpio[i] === "-") {
              const op = limpio[i]; i++;
              const d = multiplicacion();
              v = op === "+" ? v + d : v - d;
            }
            return v;
          }
          const resultado = suma();
          if (i !== limpio.length || !isFinite(resultado)) return null;
          return Math.round(resultado * 100) / 100;
        } catch (e) {
          return null;
        }
      }

      function formatearExpr(expr) {
        return expr.replace(/\*/g, "×").replace(/\//g, "÷");
      }

      function panelCalcHTML(idx) {
        const teclas = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "C", "0", ".", "⌫"];
        const clases = { "÷": "op", "×": "op", "−": "op", "C": "limpiar", "⌫": "borrar" };
        return `
          <div class="panel-calc" id="panelCalc-${idx}">
            <p class="titulo-calc">Suma cada rollo/medida y se arma el total solo</p>
            <div class="expr-box" id="exprBox-${idx}"></div>
            <div class="total-calc"><span class="l">Total</span><span class="v" id="totalCalc-${idx}">0</span></div>
            <div class="teclado-calc">
              ${teclas.map((t) => `<div class="tecla-calc ${clases[t] || ""}" data-idx="${idx}" data-tecla="${t}">${t}</div>`).join("")}
            </div>
            <div class="fila-botones-calc">
              <button type="button" class="btn btn-secondary" data-calc-cancelar="${idx}">Cancelar</button>
              <button type="button" class="btn btn-primary" data-calc-usar="${idx}">Usar este total &#8594;</button>
            </div>
          </div>`;
      }

      function pintarPanelCalc(idx) {
        const calc = obtenerCalc(idx);
        const cajaEl = document.getElementById("exprBox-" + idx);
        const totalEl = document.getElementById("totalCalc-" + idx);
        if (!cajaEl || !totalEl) return;
        if (calc.expr === "") {
          cajaEl.textContent = "Toca los números para empezar a sumar...";
          cajaEl.className = "expr-box vacio";
        } else {
          cajaEl.textContent = formatearExpr(calc.expr);
          cajaEl.className = "expr-box";
        }
        const total = evaluarExpresion(calc.expr);
        if (total === null) {
          totalEl.textContent = "—";
          totalEl.className = "v invalido";
        } else {
          totalEl.textContent = total + " " + estado.unitLabel;
          totalEl.className = "v";
        }
      }

      function teclaCalc(idx, tecla) {
        const calc = obtenerCalc(idx);
        if (tecla === "C") calc.expr = "";
        else if (tecla === "⌫") calc.expr = calc.expr.slice(0, -1);
        else calc.expr += ({ "×": "*", "÷": "/", "−": "-" })[tecla] || tecla;
        pintarPanelCalc(idx);
      }

      function bindCalcListeners(idx) {
        const panel = document.getElementById("panelCalc-" + idx);
        if (!panel) return;
        panel.querySelectorAll(".tecla-calc").forEach((btn) => {
          btn.addEventListener("click", () => teclaCalc(idx, btn.dataset.tecla));
        });
        const btnCancelar = panel.querySelector("[data-calc-cancelar]");
        if (btnCancelar) btnCancelar.addEventListener("click", () => cancelarCalc(idx));
        const btnUsar = panel.querySelector("[data-calc-usar]");
        if (btnUsar) btnUsar.addEventListener("click", () => usarTotalCalc(idx));
        pintarPanelCalc(idx);
      }

      function toggleCalc(idx) {
        const calc = obtenerCalc(idx);
        if (calc.abierto) { cancelarCalc(idx); return; }
        // Si el comentario ya tiene algo que se ve como una suma (p. ej. al
        // volver a abrir un ítem que ya se había guardado), se precarga ahí
        // para poder seguir editándola en vez de empezar de cero.
        if (!calc.expr) {
          const inputObs = document.getElementById("inpObs-" + idx);
          const obsActual = inputObs ? inputObs.value.trim() : "";
          if (obsActual && /^[0-9+\-*/.\s]+$/.test(obsActual)) calc.expr = obsActual.replace(/\s+/g, "");
        }
        calc.abierto = true;
        const btnToggle = document.querySelector(`[data-calc-toggle="${idx}"]`);
        if (btnToggle) {
          btnToggle.textContent = "🧮 Ocultar calculadora";
          btnToggle.insertAdjacentHTML("afterend", panelCalcHTML(idx));
        }
        bindCalcListeners(idx);
      }

      function cancelarCalc(idx) {
        const calc = obtenerCalc(idx);
        calc.abierto = false;
        const panel = document.getElementById("panelCalc-" + idx);
        if (panel) panel.remove();
        const btnToggle = document.querySelector(`[data-calc-toggle="${idx}"]`);
        if (btnToggle) btnToggle.textContent = "🧮 Usar calculadora";
      }

      function usarTotalCalc(idx) {
        const calc = obtenerCalc(idx);
        const total = evaluarExpresion(calc.expr);
        if (total === null) {
          mostrarToast("Escribe una suma válida antes de usar el total.");
          return;
        }
        const inputCant = document.getElementById("inpContado-" + idx);
        const inputObs = document.getElementById("inpObs-" + idx);
        if (inputCant) inputCant.value = total;
        if (inputObs) inputObs.value = calc.expr;
        cancelarCalc(idx);
        actualizarTarjeta(idx);
        mostrarToast("Total aplicado: " + total + " " + estado.unitLabel);
      }

      function estadoItem(it) {
        if (it.cantidadContada === "" || it.cantidadContada === null || it.cantidadContada === undefined) return "pendiente";
        const dif = redondear2(Number(it.cantidadContada) - Number(it.cantidadSistema));
        return dif !== 0 ? "diferencia" : "contado";
      }
      function redondear2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

      function render() {
        const totalItems = estado.items.length;
        const contados = estado.items.filter((it) => estadoItem(it) !== "pendiente").length;
        const conDiferencia = estado.items.filter((it) => estadoItem(it) === "diferencia").length;
        const pct = totalItems === 0 ? 0 : Math.round((contados / totalItems) * 100);
        const todosContados = contados === totalItems && totalItems > 0;

        const visibles = estado.items.filter((it) => {
          if (filtroActivo === "todos") return true;
          return estadoItem(it) === filtroActivo;
        });

        document.getElementById("contenido").innerHTML = `
          <div class="progreso-corte">
            <div class="fila-top"><span>Ítems contados</span><b>${contados} de ${totalItems}</b></div>
            <div class="progreso"><div class="barra"><div class="fill" style="width:${pct}%;"></div></div><span class="txt">${pct}%</span></div>
          </div>
          <div class="chip-row">
            <span class="chip ${filtroActivo === "todos" ? "on" : ""}" data-filtro="todos">Todos (${totalItems})</span>
            <span class="chip ${filtroActivo === "pendiente" ? "on" : ""}" data-filtro="pendiente">Pendientes (${totalItems - contados})</span>
            <span class="chip ${filtroActivo === "contado" ? "on" : ""}" data-filtro="contado">Contados (${contados - conDiferencia})</span>
            <span class="chip ${filtroActivo === "diferencia" ? "on" : ""}" data-filtro="diferencia">Con diferencia (${conDiferencia})</span>
          </div>
          <div id="listaItems"></div>
          ${todosContados
            ? `<button class="btn btn-primary" id="btnFinalizar">Finalizar corte y generar reporte</button>
               <p style="font-size:11px;color:var(--gris);text-align:center;margin:8px 0 0;">Esto ajusta el stock de cada ítem con diferencia y lo deja registrado en su historial.</p>`
            : `<button class="btn btn-primary" disabled>Finalizar corte (faltan ${totalItems - contados} ítems)</button>
               <p style="font-size:11px;color:var(--gris);text-align:center;margin:8px 0 0;">Puedes salir y seguir después — lo ya contado queda guardado.</p>`}
          <a href="historial-cortes-generales.html?modulo=${mod.key}" class="link-mini" style="display:block;text-align:center;margin-top:14px;">Ver historial de cortes anteriores</a>
        `;

        document.getElementById("listaItems").innerHTML = visibles.length === 0
          ? '<p style="font-size:13px;color:var(--gris);margin-top:10px;">No hay ítems en este filtro.</p>'
          : visibles.map((it) => {
              const est = estadoItem(it);
              const idxReal = estado.items.indexOf(it);
              // El comentario, la línea de diferencia y el botón "Guardar" SIEMPRE
              // se muestran (no solo cuando ya hay una diferencia guardada) — antes
              // estaban condicionados a "dif !== null", que solo era cierto DESPUÉS
              // de guardar, así que mientras la persona escribía no pasaba nada. El
              // recálculo en vivo mientras se escribe lo hace actualizarTarjeta().
              return `
                <div class="req-item item-corte ${est === "contado" ? "contado" : ""} ${est === "diferencia" ? "diferencia" : ""}" id="card-${idxReal}" style="margin-bottom:10px;">
                  <div class="fila">
                    <span class="reqid" style="font-size:14px;">${it.referencia || it.codigo}</span>
                    <span class="badge badge-${est === "pendiente" ? "Pendiente" : est === "diferencia" ? "Ajustado" : "Óptimo"}" id="badge-${idxReal}">${est === "pendiente" ? "Pendiente" : est === "diferencia" ? "Diferencia" : "Sin diferencia"}</span>
                  </div>
                  <p class="op" style="margin-bottom:8px;">${it.codigo}${it.empresa ? " · " + it.empresa : ""}</p>
                  <div class="campos-corte">
                    <div class="campo"><label>Sistema</label><div class="solo-lectura">${it.cantidadSistema} ${estado.unitLabel}</div></div>
                    <div class="campo"><label>Contado</label><input type="number" step="0.01" min="0" placeholder="0" value="${it.cantidadContada}" id="inpContado-${idxReal}" class="inpContado" data-idx="${idxReal}"></div>
                  </div>
                  <p class="dif-linea" id="difLinea-${idxReal}"></p>
                  <button type="button" class="btn-calc-toggle" data-calc-toggle="${idxReal}">🧮 ${obtenerCalc(idxReal).abierto ? "Ocultar calculadora" : "Usar calculadora"}</button>
                  ${obtenerCalc(idxReal).abierto ? panelCalcHTML(idxReal) : ""}
                  <label id="obsLabel-${idxReal}">Observación (opcional)</label>
                  <textarea rows="2" id="inpObs-${idxReal}" placeholder="Ej: rollo húmedo descartado...">${it.observacion || ""}</textarea>
                  <button class="btn btn-secondary btnGuardarConteo" data-idx="${idxReal}" style="margin-top:-2px;">Guardar este ítem</button>
                </div>`;
            }).join("");

        // Pinta el estado inicial de cada tarjeta (por si ya tenía un conteo
        // guardado de antes) y deja el recálculo en vivo enganchado al "input".
        visibles.forEach((it) => {
          const idxReal = estado.items.indexOf(it);
          actualizarTarjeta(idxReal);
        });
        document.querySelectorAll(".inpContado").forEach((inp) => {
          inp.addEventListener("input", () => actualizarTarjeta(Number(inp.dataset.idx)));
        });
        document.querySelectorAll(".btnGuardarConteo").forEach((btn) => {
          btn.addEventListener("click", () => guardarConteo(Number(btn.dataset.idx)));
        });
        document.querySelectorAll(".chip[data-filtro]").forEach((chip) => {
          chip.addEventListener("click", () => { filtroActivo = chip.dataset.filtro; render(); });
        });
        document.querySelectorAll(".btn-calc-toggle").forEach((btn) => {
          btn.addEventListener("click", () => toggleCalc(Number(btn.dataset.calcToggle)));
        });
        // Si la pantalla se repintó por completo (p. ej. al cambiar de filtro)
        // mientras una calculadora ya estaba abierta, hay que re-enganchar
        // sus botones — el repintado reemplaza todo el HTML de la lista.
        visibles.forEach((it) => {
          const idxReal = estado.items.indexOf(it);
          if (obtenerCalc(idxReal).abierto) bindCalcListeners(idxReal);
        });
        if (todosContados) {
          document.getElementById("btnFinalizar").addEventListener("click", finalizar);
        }
      }

      // Recalcula en vivo (sin volver a pedir nada al servidor) la diferencia,
      // el estado visual de la tarjeta y si el comentario es obligatorio —
      // se dispara en cada tecla que se escribe en "Contado".
      function actualizarTarjeta(idx) {
        const it = estado.items[idx];
        const inputCant = document.getElementById("inpContado-" + idx);
        const difEl = document.getElementById("difLinea-" + idx);
        const obsLabel = document.getElementById("obsLabel-" + idx);
        const cardEl = document.getElementById("card-" + idx);
        const badgeEl = document.getElementById("badge-" + idx);
        if (!inputCant) return;
        const cantidad = inputCant.value;

        if (cantidad === "") {
          difEl.textContent = "";
          obsLabel.textContent = "Observación (opcional)";
          obsLabel.style.color = "";
          cardEl.className = "req-item item-corte";
          badgeEl.className = "badge badge-Pendiente";
          badgeEl.textContent = "Pendiente";
          return;
        }

        const dif = redondear2(Number(cantidad) - Number(it.cantidadSistema));
        if (dif === 0) {
          difEl.textContent = "Coincide con el sistema.";
          difEl.className = "dif-linea pos";
          obsLabel.textContent = "Observación (opcional)";
          obsLabel.style.color = "";
          cardEl.className = "req-item item-corte contado";
          badgeEl.className = "badge badge-Óptimo";
          badgeEl.textContent = "Sin diferencia";
        } else {
          difEl.textContent = "Diferencia: " + (dif > 0 ? "+" : "") + dif + " " + estado.unitLabel + (dif > 0 ? " (sobrante)" : " (faltante)");
          difEl.className = "dif-linea neg";
          obsLabel.textContent = "Observación (obligatoria — hay diferencia)";
          obsLabel.style.color = "var(--ambar)";
          cardEl.className = "req-item item-corte diferencia";
          badgeEl.className = "badge badge-Ajustado";
          badgeEl.textContent = "Diferencia";
        }
      }

      async function guardarConteo(idx) {
        const errorEl = document.getElementById("errorMsg");
        errorEl.style.display = "none";
        const it = estado.items[idx];
        const inputCant = document.getElementById("inpContado-" + idx);
        const inputObs = document.getElementById("inpObs-" + idx);
        const cantidad = inputCant ? inputCant.value : "";
        const observacion = inputObs ? inputObs.value : "";
        if (cantidad === "" || Number(cantidad) < 0) {
          errorEl.textContent = "Ingresa una cantidad contada válida para " + (it.referencia || it.codigo) + ".";
          errorEl.style.display = "block";
          return;
        }
        const dif = redondear2(Number(cantidad) - Number(it.cantidadSistema));
        if (dif !== 0 && !observacion.trim()) {
          errorEl.textContent = "Hay diferencia en \"" + (it.referencia || it.codigo) + "\" (" + (dif > 0 ? "+" : "") + dif + " " + estado.unitLabel + ") — el comentario es obligatorio para poder guardarlo.";
          errorEl.style.display = "block";
          return;
        }
        try {
          const res = await apiPost("guardarConteoGeneral", {
            modulo: mod.key,
            loteId: estado.loteId,
            codigo: it.codigo,
            cantidadContada: cantidad,
            observacion: observacion,
            registro: usuario.nombre,
            idempotencia: idemItem(idx),
          });
          delete idemPorItem[idx]; // se guardó bien: si se vuelve a editar este ítem, es un intento nuevo
          it.cantidadContada = Number(cantidad);
          it.observacion = observacion;
          estado.itemsContados = res.itemsContados;
          mostrarToast("Guardado: " + (it.referencia || it.codigo));
          render();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      }

      async function finalizar() {
        try {
          const res = await apiPost("finalizarCorteGeneral", { modulo: mod.key, loteId: estado.loteId, registro: usuario.nombre, idempotencia: idemParaFinalizar() });
          window.location.href = "reporte-corte-general.html?modulo=" + mod.key + "&loteId=" + encodeURIComponent(res.loteId);
        } catch (err) {
          document.getElementById("errorMsg").textContent = err.message;
          document.getElementById("errorMsg").style.display = "block";
        }
      }

      async function cargar() {
        try {
          estado = await apiGet("iniciarCorteGeneral", { modulo: mod.key, empresa: "", registro: usuario.nombre });
          render();
        } catch (err) {
          document.getElementById("contenido").innerHTML =
            `<p style="font-size:13px;color:var(--rojo);margin-top:16px;">No se pudo cargar el corte: ${err.message}</p>
             <button class="btn btn-secondary" onclick="cargar()" style="margin-top:8px;">Reintentar</button>`;
        }
      }
      window.cargar = cargar;
      cargar();
    }
  }
</script>
</body>
</html>
