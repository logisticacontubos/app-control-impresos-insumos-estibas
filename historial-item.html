<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial del ítem · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar no-imprimir">
    <a class="back" id="backLink" href="inventario.html">&#8592;</a>
    <div>
      <h1 id="titulo">Historial del ítem</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="encabezado-pdf solo-impresion">
      <img id="logoPdf" src="" alt="">
      <div class="txt">
        <h2 id="tituloPdf">Historial del ítem</h2>
        <p id="subPdf"></p>
      </div>
    </div>

    <div class="req-item no-imprimir" id="cardItem" style="margin-bottom:14px;"></div>

    <div class="chip-row no-imprimir" id="filtrosFecha" style="margin-bottom:10px;">
      <span class="chip" data-rango="hoy">Hoy</span>
      <span class="chip" data-rango="ayer">Ayer</span>
      <span class="chip" data-rango="semana">Semana</span>
      <span class="chip" data-rango="mes">Mes</span>
      <span class="chip" data-rango="todo">Todo</span>
      <span class="chip" data-rango="personalizado">Fechas abiertas</span>
    </div>
    <div id="rangoPersonalizado" class="no-imprimir" style="display:none;gap:8px;margin:0 0 12px;">
      <input type="date" id="fechaDesde" style="flex:1;">
      <input type="date" id="fechaHasta" style="flex:1;">
    </div>

    <div class="btn-row no-imprimir" style="margin-bottom:12px;">
      <a class="btn btn-primary" id="btnCorte" href="#" style="text-decoration:none;text-align:center;">Registrar corte</a>
      <button class="btn btn-secondary" id="btnExcel">Descargar Excel</button>
      <button class="btn btn-secondary" id="btnPdf">Descargar PDF</button>
    </div>

    <!-- Resumen de 5 estadísticas (igual al mockup aprobado): inventario
         inicial del rango, entradas, salidas, ajustes por corte y saldo final. -->
    <div class="resumen-stats solo-impresion" id="resumenStats"></div>

    <!-- Tabla para imprimir/PDF/Excel — respeta el filtro de fecha activo,
         orden CRONOLÓGICO (más viejo primero) con una fila "Inicial" al
         principio, igual al mockup aprobado. -->
    <div class="solo-impresion" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:10.5px;">
        <thead>
          <tr style="background:var(--fondo);text-align:left;">
            <th style="padding:6px 7px;border:1px solid var(--borde);">Fecha / hora</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Movimiento</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">ID</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Entrada</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Salida</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Saldo</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Quién</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">A quién</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Comentario / observación</th>
          </tr>
        </thead>
        <tbody id="tbodyImpresion"></tbody>
      </table>
    </div>

    <div id="lista" class="no-imprimir"></div>

    <!-- Pie propio del PDF: ver nota en Inventario/Reporte — el pie que agrega
         Chrome de escritorio no existe en la mayoría de navegadores de
         celular, así que esta información se dibuja aquí directamente. -->
    <div class="pie-pdf solo-impresion" id="piePdf"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod, empresaActual } = ctx;
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("codigo") || "";
    document.getElementById("backLink").href = "inventario.html?modulo=" + mod.key;
    document.getElementById("titulo").textContent = "Historial del ítem";
    document.getElementById("sub").textContent = mod.label;
    document.getElementById("logoPdf").src = empresaActual === "Tecnipapel" ? "assets/logo-tecnipapel.png" : "assets/logo-contubos.png";

    let movimientos = [];
    let itemsFiltrados = [];
    let datosItem = null;

    // Mismo esquema de rangos rápidos que "Historial de movimientos": fechas
    // ISO como strings, comparables directo con <= y >=.
    function rangoFecha(modo) {
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const fmt = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      if (modo === "hoy") return { desde: fmt(hoy), hasta: fmt(hoy) };
      if (modo === "ayer") {
        const ayer = new Date(hoy);
        ayer.setDate(ayer.getDate() - 1);
        return { desde: fmt(ayer), hasta: fmt(ayer) };
      }
      if (modo === "semana") {
        const inicio = new Date(hoy);
        const diaSemana = (inicio.getDay() + 6) % 7;
        inicio.setDate(inicio.getDate() - diaSemana);
        return { desde: fmt(inicio), hasta: fmt(hoy) };
      }
      if (modo === "mes") {
        const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        return { desde: fmt(inicio), hasta: fmt(hoy) };
      }
      if (modo === "personalizado") {
        const desde = document.getElementById("fechaDesde").value;
        const hasta = document.getElementById("fechaHasta").value;
        if (!desde && !hasta) return null;
        return { desde: desde || "0000-00-00", hasta: hasta || "9999-99-99" };
      }
      return null;
    }

    let rangoActivo = "todo";

    const ETIQUETAS = {
      ingreso: { texto: "Ingreso de stock", signo: "+", color: "var(--verde)" },
      salida: { texto: "Entrega", signo: "-", color: "var(--magenta)" },
      devolucion: { texto: "Devolución", signo: "+", color: "var(--verde)" },
      corte: { texto: "Corte de inventario", signo: "", color: "var(--gris)" },
    };

    function redondear2(n) {
      return Math.round((Number(n) || 0) * 100) / 100;
    }

    // Arma el reporte (mismo formato que el mockup aprobado): orden
    // cronológico ascendente, una fila "Inicial" reconstruida antes del
    // primer movimiento del rango, y los 5 totales de resumen.
    function construirReporte(items) {
      const cron = items.slice().sort((a, b) => String(a.fecha + " " + a.hora).localeCompare(String(b.fecha + " " + b.hora)));
      const stockActual = datosItem && datosItem.stockActual !== "" ? Number(datosItem.stockActual) : 0;
      let inicial = stockActual;
      if (cron.length > 0) {
        const primero = cron[0];
        if (primero.tipo === "corte") inicial = primero.cantidadSistema;
        else if (primero.tipo === "ingreso" || primero.tipo === "devolucion") inicial = redondear2(primero.saldo - primero.cantidad);
        else if (primero.tipo === "salida") inicial = redondear2(primero.saldo + primero.cantidad);
      }
      let totalEntradas = 0, totalSalidas = 0, ajustes = 0;
      cron.forEach((m) => {
        if (m.tipo === "ingreso" || m.tipo === "devolucion") totalEntradas = redondear2(totalEntradas + m.cantidad);
        else if (m.tipo === "salida") totalSalidas = redondear2(totalSalidas + m.cantidad);
        else if (m.tipo === "corte") ajustes = redondear2(ajustes + m.diferencia);
      });
      const final = cron.length > 0 ? cron[cron.length - 1].saldo : inicial;
      return { inicial, totalEntradas, totalSalidas, ajustes, final, cron };
    }

    function render() {
      const rango = rangoFecha(rangoActivo);
      itemsFiltrados = !rango ? movimientos : movimientos.filter((m) => m.fecha >= rango.desde && m.fecha <= rango.hasta);

      document.getElementById("lista").innerHTML = itemsFiltrados.length === 0
        ? '<p style="font-size:13px;color:var(--gris);margin-top:16px;">No hay movimientos en este rango.</p>'
        : itemsFiltrados.map((m) => {
            const et = ETIQUETAS[m.tipo];
            const quienTxt = m.tipo === "ingreso"
              ? "Ingresó " + (m.quien || "-")
              : m.tipo === "salida"
                ? "Entregó " + (m.quien || "-") + " a " + (m.aQuien || "-")
                : m.tipo === "devolucion"
                  ? "Devolvió " + (m.quien || "-") + (m.aQuien ? " · recibió " + m.aQuien : "")
                  : "Registró " + (m.quien || "-");
            const cantidadTxt = m.tipo === "corte"
              ? "Contado: " + m.cantidad + " " + mod.unitLabel + (m.diferencia ? " (dif. " + (m.diferencia > 0 ? "+" : "") + m.diferencia + ")" : "")
              : et.signo + m.cantidad + " " + mod.unitLabel;
            return `
              <div class="req-item">
                <div class="fila">
                  <span class="reqid" style="font-size:14px;">${m.id || ""}</span>
                  <span style="font-weight:700;color:${et.color};">${et.texto} · ${cantidadTxt}</span>
                </div>
                <p class="op">${quienTxt}</p>
                <p class="op">${m.fecha}${m.hora ? " " + m.hora : ""}${m.empresa ? " · " + m.empresa : ""}</p>
                ${m.detalle ? `<p class="op">${m.detalle}</p>` : ""}
                <p class="op" style="font-weight:600;">Saldo: ${m.saldo !== undefined ? m.saldo : "-"} ${mod.unitLabel}</p>
              </div>`;
          }).join("");

      const reporte = construirReporte(itemsFiltrados);
      const unit = mod.unitLabel;

      document.getElementById("resumenStats").innerHTML = `
        <div class="stat inicial"><p class="l">Inventario inicial</p><p class="v">${reporte.inicial} ${unit}</p></div>
        <div class="stat entradas"><p class="l">Total entradas</p><p class="v">+${reporte.totalEntradas} ${unit}</p></div>
        <div class="stat salidas"><p class="l">Total salidas</p><p class="v">-${reporte.totalSalidas} ${unit}</p></div>
        <div class="stat ajustes"><p class="l">Ajustes</p><p class="v">${reporte.ajustes > 0 ? "+" : ""}${reporte.ajustes} ${unit}</p></div>
        <div class="stat final"><p class="l">Saldo final</p><p class="v">${reporte.final} ${unit}</p></div>
      `;

      const celda = (v) => `<td style="padding:6px 7px;border:1px solid var(--borde);">${v}</td>`;
      const filaInicial = `<tr class="fila-inicial">` +
        celda((reporte.cron[0] ? reporte.cron[0].fecha : "") + "") + celda("Inicial") + celda("-") +
        celda(reporte.inicial + " " + unit) + celda("-") + celda(reporte.inicial + " " + unit) +
        celda("Inventario al inicio del rango") + celda("-") + celda("-") +
        "</tr>";
      document.getElementById("tbodyImpresion").innerHTML = itemsFiltrados.length === 0
        ? `<tr><td colspan="9" style="padding:10px;border:1px solid var(--borde);color:var(--gris);">No hay movimientos en este rango.</td></tr>`
        : filaInicial + reporte.cron.map((m) => {
            const et = ETIQUETAS[m.tipo];
            const quienTxt = m.quien || "-";
            const aQuienTxt = m.tipo === "salida" ? (m.aQuien || "-") : m.tipo === "devolucion" ? (m.aQuien || "-") : "-";
            const entradaTxt = (m.tipo === "ingreso" || m.tipo === "devolucion") ? (m.cantidad + " " + unit) : "-";
            const salidaTxt = m.tipo === "salida" ? (m.cantidad + " " + unit) : "-";
            const comentario = m.tipo === "corte"
              ? "Corte" + (m.diferencia ? " · dif. " + (m.diferencia > 0 ? "+" : "") + m.diferencia : "") + (m.detalle ? " · " + m.detalle : "")
              : (m.detalle || "-");
            const claseFila = m.tipo === "corte" && m.diferencia ? ' class="fila-ajuste"' : "";
            return `<tr${claseFila}>` +
              celda((m.fecha || "") + (m.hora ? " " + m.hora : "")) + celda(et.texto) + celda(m.id || "") +
              celda(entradaTxt) + celda(salidaTxt) + celda(m.saldo !== undefined ? m.saldo + " " + unit : "") +
              celda(quienTxt) + celda(aQuienTxt) + celda(comentario) +
              "</tr>";
          }).join("");
    }

    async function cargar() {
      const datos = await apiGet("getHistorialItem", { modulo: mod.key, codigo: codigo });
      datosItem = datos;
      movimientos = datos.movimientos || [];
      document.getElementById("btnCorte").href = "corte-inventario.html?modulo=" + mod.key + "&codigo=" + encodeURIComponent(codigo);
      const uc = datos.ultimoCorte;
      document.getElementById("cardItem").innerHTML = `
        <div class="fila"><span class="reqid" style="font-size:15px;">${datos.referencia || codigo}</span></div>
        <p class="op">Código: ${datos.codigo}</p>
        ${datos.stockActual !== "" ? `<p class="op" style="font-weight:600;">Stock actual: ${datos.stockActual} ${datos.unitLabel}</p>` : ""}
        ${uc ? `<p class="op">Último corte: ${uc.cantidad} ${datos.unitLabel} el ${uc.fecha}${uc.hora ? " " + uc.hora : ""} (registró ${uc.quien || "-"})</p>` : `<p class="op" style="color:var(--gris);">Todavía no se ha registrado ningún corte de inventario.</p>`}
      `;
      document.getElementById("tituloPdf").textContent = "Historial · " + (datos.referencia || codigo);
      document.getElementById("subPdf").textContent =
        mod.label + " · " + empresaActual + " · Código " + datos.codigo +
        (datos.stockActual !== "" ? " · Stock actual " + datos.stockActual + " " + datos.unitLabel : "") +
        " · generado " + fechaHoy();
      document.getElementById("piePdf").textContent =
        "Generado por " + usuario.nombre + " (" + usuario.rol + ") · " + fechaHoy() + " " + horaActual() + " · " + window.location.hostname;
      render();
    }

    document.querySelectorAll("#filtrosFecha .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        rangoActivo = chip.dataset.rango;
        document.querySelectorAll("#filtrosFecha .chip").forEach((c) => c.classList.toggle("on", c === chip));
        document.getElementById("rangoPersonalizado").style.display = rangoActivo === "personalizado" ? "flex" : "none";
        render();
      });
    });
    document.getElementById("fechaDesde").addEventListener("change", render);
    document.getElementById("fechaHasta").addEventListener("change", render);
    document.querySelector('#filtrosFecha .chip[data-rango="todo"]').classList.add("on");

    // Descarga en Excel: los movimientos que están filtrados/visibles en ese
    // momento (respeta el rango de fecha elegido con los chips).
    document.getElementById("btnExcel").addEventListener("click", () => {
      if (!datosItem) return;
      const reporte = construirReporte(itemsFiltrados);
      const unit = mod.unitLabel;
      const wb = XLSX.utils.book_new();
      const filaInicial = ["Inicial", "", (reporte.cron[0] ? reporte.cron[0].fecha : ""), "", reporte.inicial, "", reporte.inicial, "-", "-", "Inventario al inicio del rango"];
      const filas = [
        ["Historial del ítem", datosItem.referencia || codigo, mod.label, empresaActual],
        ["Código", datosItem.codigo, "Stock actual", datosItem.stockActual !== "" ? datosItem.stockActual + " " + datosItem.unitLabel : ""],
        [],
        ["Inventario inicial", reporte.inicial, "Total entradas", reporte.totalEntradas, "Total salidas", reporte.totalSalidas, "Ajustes", reporte.ajustes, "Saldo final", reporte.final],
        [],
        ["Movimiento", "ID", "Fecha", "Hora", "Entrada", "Salida", "Saldo", "Quién", "A quién", "Comentario"],
        filaInicial,
        ...reporte.cron.map((m) => {
          const et = ETIQUETAS[m.tipo];
          const aQuienTxt = m.tipo === "salida" || m.tipo === "devolucion" ? (m.aQuien || "") : "";
          const entrada = (m.tipo === "ingreso" || m.tipo === "devolucion") ? m.cantidad : "";
          const salida = m.tipo === "salida" ? m.cantidad : "";
          const comentario = m.tipo === "corte"
            ? "Corte" + (m.diferencia ? " · dif. " + (m.diferencia > 0 ? "+" : "") + m.diferencia : "") + (m.detalle ? " · " + m.detalle : "")
            : (m.detalle || "");
          return [et.texto, m.id || "", m.fecha || "", m.hora || "", entrada, salida, m.saldo !== undefined ? m.saldo : "", m.quien || "", aQuienTxt, comentario];
        }),
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filas), "Historial");
      const nombre = `Historial_${(datosItem.referencia || codigo).replace(/[^a-z0-9]+/gi, "_")}_${fechaHoy()}.xlsx`;
      XLSX.writeFile(wb, nombre);
    });

    // Descarga en PDF: mismo mecanismo que Inventario/Reporte (diálogo de
    // impresión del navegador, con la tabla y el pie propio).
    document.getElementById("btnPdf").addEventListener("click", () => {
      window.print();
    });

    cargar();
  }
</script>
</body>
</html>
