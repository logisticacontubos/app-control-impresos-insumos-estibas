<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <main style="padding-top:20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <img id="logoEmpresa" src="assets/logo-contubos.png" alt="Contubos" style="height:22px;width:auto;object-fit:contain;">
      <div style="display:flex;gap:8px;">
        <a href="#" onclick="window.location.reload();return false;" title="Actualizar"
           style="width:38px;height:38px;border-radius:11px;background:#fff;box-shadow:0 6px 18px rgba(26,26,26,0.18);display:flex;align-items:center;justify-content:center;color:var(--magenta);text-decoration:none;font-size:18px;">
          &#8635;
        </a>
        <a href="#" onclick="cerrarSesion();return false;" title="Cerrar sesión"
           style="width:38px;height:38px;border-radius:11px;background:#fff;box-shadow:0 6px 18px rgba(26,26,26,0.18);display:flex;align-items:center;justify-content:center;color:var(--texto);text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </a>
      </div>
    </div>

    <div id="selectorEmpresa" class="chip-row" style="display:none;"></div>

    <div class="card" style="border-left:5px solid var(--magenta);box-shadow:0 8px 22px var(--magenta-sombra, rgba(208,17,72,0.22));">
      <p id="nombreUsuario" style="font-size:19px;font-weight:700;margin:0 0 3px;">Cargando...</p>
      <p id="rolUsuario" style="font-size:14px;color:var(--gris);margin:0;"></p>
    </div>

    <p style="font-size:12px;color:var(--gris);margin:20px 0 8px;">Módulos</p>
    <div id="modulos"></div>

    <div id="seccionPendientesGlobal" style="display:none;margin-top:8px;">
      <button class="accion" id="btnPendientesGlobal" style="text-align:left;">
        <span class="icono">&#128230;</span>
        <span>Requisiciones pendientes<div class="sub" id="subPendientesGlobal"></div></span>
      </button>
      <div id="listaPendientesGlobal" style="display:none;margin-top:4px;"></div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
const usuario = requiereSesion();

function actualizarLogo(empresa) {
  const logo = document.getElementById("logoEmpresa");
  if (empresa === "Tecnipapel") { logo.src = "assets/logo-tecnipapel.png"; logo.alt = "Tecnipapel"; }
  else { logo.src = "assets/logo-contubos.png"; logo.alt = "Contubos"; }
}

function renderSelectorEmpresa() {
  const cont = document.getElementById("selectorEmpresa");
  if (!esMultiEmpresa(usuario)) { cont.style.display = "none"; return; }
  const activa = obtenerEmpresaActiva();
  cont.style.display = "flex";
  cont.innerHTML = ["Contubos", "Tecnipapel"].map((e) =>
    `<span class="chip ${e === activa ? "on" : ""}" onclick="cambiarEmpresaActiva('${e}')">${e}</span>`
  ).join("");
}

function cambiarEmpresaActiva(empresa) {
  if (empresa === obtenerEmpresaActiva()) return;
  establecerEmpresaActiva(empresa);
  renderSelectorEmpresa();
  aplicarTema(empresa);
  actualizarLogo(empresa);
  renderModulos();
  // También se refresca la cola de pendientes al cambiar de empresa con los
  // chips de arriba, para que muestre solo lo de la empresa en la que está
  // parado en ese momento (window.cargarPendientesGlobal se define más abajo,
  // en el bloque que arma esa sección).
  if (window.cargarPendientesGlobal) window.cargarPendientesGlobal();
}

if (usuario) {
  if (esMultiEmpresa(usuario) && !obtenerEmpresaActiva()) establecerEmpresaActiva("Contubos");
  aplicarTema(obtenerEmpresaActiva());
  actualizarLogo(obtenerEmpresaActiva());
  renderSelectorEmpresa();

  const primerNombre = (usuario.nombre || "").split(" ")[0];
  document.getElementById("nombreUsuario").textContent = "Hola, " + primerNombre;
  document.getElementById("rolUsuario").textContent = usuario.cargo || usuario.rol;

  const iconos = {
    impresos: "🧻",
    insumos: "📦",
    estibas: "🪵",
  };
  // El módulo solo aparece si el usuario tiene acceso Y la empresa activa en pantalla
  // (roja Contubos / verde Tecnipapel) realmente maneja ese módulo — Impresos es solo
  // Contubos, así que en contexto Tecnipapel no debe salir su ícono aunque el usuario
  // sea de "Ambas" empresas.
  function renderModulos() {
    const empresaActiva = obtenerEmpresaActiva();
    const accesibles = Object.values(MODULOS).filter((m) =>
      puedeAccederModulo(usuario, m.key) && m.empresas.includes(empresaActiva));
    document.getElementById("modulos").innerHTML = accesibles.map((m) => `
      <a class="accion" href="modulo.html?modulo=${m.key}">
        <span class="icono">${iconos[m.key] || "•"}</span>
        <span>${m.label}<div class="sub">${m.empresas.join(" / ")}</div></span>
      </a>`).join("");
  }
  renderModulos();

  // Resumen de pendientes de TODOS los módulos, directo en el inicio, para
  // CUALQUIER usuario (no solo quien entrega) — mostrando solo lo de la
  // empresa en la que está parado en ese momento (el chip Contubos/
  // Tecnipapel de arriba), no las dos mezcladas.
  {
    const seccion = document.getElementById("seccionPendientesGlobal");
    const btn = document.getElementById("btnPendientesGlobal");
    const sub = document.getElementById("subPendientesGlobal");
    const lista = document.getElementById("listaPendientesGlobal");
    let abierto = false;
    let pendientesPorModulo = [];

    async function cargarPendientesGlobal() {
      const modulosAcceso = Object.values(MODULOS).filter((m) => puedeAccederModulo(usuario, m.key));
      // Se filtra explícitamente por la empresa activa (el chip seleccionado
      // arriba), en vez de traer las dos empresas mezcladas.
      const params = { empresa: obtenerEmpresaActiva() || "" };

      // Una sola llamada combinada al backend (getPendientesGlobal) en vez de
      // una llamada por módulo — reduce hasta 3 round-trips a Apps Script a 1
      // solo. Además se marca "silencioso" para que esta carga de fondo no
      // bloquee toda la pantalla con el overlay de carga, ya que los módulos
      // arriba ya están listos para usarse mientras esto termina de llegar.
      const data = await apiGet("getPendientesGlobal", params, { silencioso: true });
      pendientesPorModulo = modulosAcceso.flatMap((m) =>
        (data[m.key] || []).map((r) => ({ r, mod: m }))
      );

      if (pendientesPorModulo.length === 0) {
        seccion.style.display = "none";
        return;
      }
      seccion.style.display = "block";
      sub.textContent = pendientesPorModulo.length + " por entregar";
      lista.innerHTML = pendientesPorModulo.map(({ r, mod: m }) => `
        <a class="req-item" href="bodega.html?modulo=${m.key}#req-${r.ID}">
          <div class="fila"><span class="reqid">${r.ID}</span><span class="badge badge-Pendiente">${m.label}${r["Empresa"] ? " · " + r["Empresa"] : ""}</span></div>
          <p class="op" style="font-weight:600;">${r["Referencia"]}</p>
          ${detalleRequisicion(r, m)}
        </a>`).join("");
    }

    window.cargarPendientesGlobal = cargarPendientesGlobal;

    btn.addEventListener("click", () => {
      abierto = !abierto;
      lista.style.display = abierto ? "block" : "none";
    });

    cargarPendientesGlobal();
  }
}
</script>
</body>
</html>
