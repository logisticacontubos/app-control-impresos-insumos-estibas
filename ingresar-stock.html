<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar stock · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="modulo.html">&#8592;</a>
    <div>
      <h1 id="titulo">Ingresar stock</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="info-msg" id="toastExito" style="display:none;"></div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="card">
      <label for="selItem">Ítem</label>
      <select id="selItem"></select>

      <label for="inpCantidad">Cantidad que llegó</label>
      <input type="number" id="inpCantidad" step="0.01" min="0.01" placeholder="0">

      <label for="inpObservacion">Observación (proveedor, factura, etc.) — opcional</label>
      <input type="text" id="inpObservacion" placeholder="Ej: Proveedor XYZ, factura 1234">

      <button class="btn btn-primary" id="btnRegistrar" style="margin-top:6px;">Registrar ingreso</button>
    </div>

    <p style="font-size:12px;color:var(--gris);margin:20px 0 8px;">Historial de ingresos</p>
    <div id="listaIngresos"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod } = ctx;
    document.getElementById("backLink").href = "modulo.html?modulo=" + mod.key;
    document.getElementById("titulo").textContent = "Ingresar stock";
    document.getElementById("sub").textContent = mod.label;

    if (!puedeIngresarStock(usuario.rol)) {
      document.querySelector("main").innerHTML = '<p style="font-size:13px;color:var(--gris);margin-top:20px;">No tienes permiso para ingresar stock en este módulo.</p>';
    } else {
      let itemsInv = [];

      async function cargarItems() {
        const invData = await apiGet("getInventario", { modulo: mod.key });
        itemsInv = invData.items || [];
        const codigoHeader = buscarEncabezado(itemsInv[0], "Código");
        const refHeader = buscarEncabezado(itemsInv[0], "Referencia");
        const sel = document.getElementById("selItem");
        sel.innerHTML = itemsInv.map((it) =>
          `<option value="${it[codigoHeader]}">${it[refHeader]} (${it[codigoHeader]})</option>`
        ).join("");
      }

      async function cargarIngresos() {
        const data = await apiGet("getIngresos", { modulo: mod.key }, { silencioso: true });
        const items = data.items || [];
        document.getElementById("listaIngresos").innerHTML = items.length === 0
          ? '<p style="font-size:13px;color:var(--gris);">Todavía no se han registrado ingresos.</p>'
          : items.map((r) => `
              <div class="req-item">
                <div class="fila">
                  <span class="reqid">${r["ID"]}</span>
                  <span class="badge badge-Óptimo">+${r["Cantidad"]} ${mod.unitLabel}</span>
                </div>
                <p class="op" style="font-weight:600;">${r["Referencia"] || r["Código"]}</p>
                <p class="op">Ingresó ${r["Ingresó"]} · ${r["Fecha"]} ${r["Hora"] || ""}${r["Empresa"] ? " · " + r["Empresa"] : ""}</p>
                ${r["Observación"] ? `<p class="op">${r["Observación"]}</p>` : ""}
              </div>`).join("");
      }

      document.getElementById("btnRegistrar").addEventListener("click", async () => {
        const errorEl = document.getElementById("errorMsg");
        errorEl.style.display = "none";
        const codigo = document.getElementById("selItem").value;
        const cantidad = document.getElementById("inpCantidad").value;
        const observacion = document.getElementById("inpObservacion").value;
        if (!codigo || !cantidad || Number(cantidad) <= 0) {
          errorEl.textContent = "Selecciona un ítem e ingresa una cantidad válida.";
          errorEl.style.display = "block";
          return;
        }
        try {
          const res = await apiPost("ingresarStock", {
            modulo: mod.key,
            codigo: codigo,
            cantidad: cantidad,
            ingreso: usuario.nombre,
            observacion: observacion,
          });
          document.getElementById("inpCantidad").value = "";
          document.getElementById("inpObservacion").value = "";
          mostrarToast(`Ingreso registrado (${res.id})`);
          if (res.stockOk === false) alert("El ingreso quedó registrado, pero no se pudo actualizar el stock del ítem — revisa que el código exista bien en el inventario.");
          cargarItems();
          cargarIngresos();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = "block";
        }
      });

      cargarItems();
      cargarIngresos();
    }
  }
</script>
</body>
</html>
