<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="home.html">&#8592;</a>
    <div>
      <h1 id="tituloModulo">Módulo</h1>
      <p class="sub" id="subModulo"></p>
    </div>
  </header>
  <main>
    <div id="selectorEmpresa" class="chip-row" style="display:none;"></div>
    <div id="acciones"></div>
    <div id="seccionResumen"></div>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod, empresas, empresaActual } = ctx;
    document.getElementById("tituloModulo").textContent = mod.label;
    document.getElementById("subModulo").textContent = empresaActual;

    if (empresas.length > 1) {
      const cont = document.getElementById("selectorEmpresa");
      cont.style.display = "flex";
      function render() {
        cont.innerHTML = empresas.map((e) =>
          `<span class="chip ${e === obtenerEmpresaActiva() ? "on" : ""}" onclick="cambiar('${e}')">${e}</span>`
        ).join("");
      }
      window.cambiar = function (e) {
        establecerEmpresaActiva(e);
        aplicarTema(e);
        mostrarLogoEnHeader(e);
        document.getElementById("subModulo").textContent = e;
        render();
        cargarResumen();
      };
      render();
    }

    const acciones = document.getElementById("acciones");
    let html = "";
    if (puedeCrearRequisicion(usuario.rol)) {
      html += `<a class="accion" href="nueva-requisicion.html?modulo=${mod.key}"><span class="icono">+</span>Nueva requisición</a>`;
    }
    if (puedeEntregar(usuario.rol)) {
      html += `<a class="accion" href="bodega.html?modulo=${mod.key}"><span class="icono">&#128230;</span>${mod.hasDevolucion ? "Entregar y devoluciones" : "Entregar"}</a>`;
    }
    html += `<a class="accion" href="inventario.html?modulo=${mod.key}"><span class="icono">&#128202;</span>Ver inventario</a>`;
    if (puedeIngresarStock(usuario.rol)) {
      html += `<a class="accion" href="ingresar-stock.html?modulo=${mod.key}"><span class="icono">&#128230;</span>Ingresar stock</a>`;
    }
    html += `<a class="accion" href="historial.html?modulo=${mod.key}"><span class="icono">&#128337;</span>Historial de movimientos</a>`;
    if (usuario.rol === "compras" || usuario.rol === "bodega" || usuario.rol === "admin") {
      html += `<a class="accion" href="compras.html?modulo=${mod.key}"><span class="icono">&#128181;</span>Vista de compras</a>`;
    }
    if (puedeVerReportes(usuario.rol)) {
      html += `<a class="accion" href="reporte.html?modulo=${mod.key}"><span class="icono">&#128202;</span>Reporte y KPI's</a>`;
    }
    acciones.innerHTML = html;

    // Resumen directo en esta pantalla, sin tener que entrar a "Entregar y devoluciones":
    // - Bodega/Admin ven la cola de pendientes (de un vistazo, solo lectura).
    // - Producción ve sus propias requisiciones con el estado actual.
    async function cargarResumen() {
      const cont = document.getElementById("seccionResumen");
      const reqData = await apiGet("getRequisiciones", { modulo: mod.key });
      const items = reqData.items || [];
      const cantSolHeader = buscarEncabezado(items[0], "Cantidad solicitada");

      if (puedeEntregar(usuario.rol)) {
        const pendientes = items.filter((r) => r.Estado === "Pendiente" || r.Estado === "Entregado parcial");
        cont.innerHTML = `<p style="font-size:12px;color:var(--gris);margin:20px 0 8px;">Cola de pendientes</p>` +
          (pendientes.length === 0
            ? '<p style="font-size:13px;color:var(--gris);">No hay requisiciones pendientes.</p>'
            : pendientes.map((r) => `
              <a class="req-item" href="bodega.html?modulo=${mod.key}#req-${r.ID}">
                <div class="fila"><span class="reqid">${r.ID}</span><span class="badge badge-${claseEstado(r.Estado)}">${r.Estado}</span></div>
                <p class="op" style="font-weight:600;">${r["Referencia"]}</p>
                ${detalleRequisicion(r, mod)}
                <p class="op" style="color:var(--magenta);font-weight:700;margin-top:6px;">Toca para entregar &#8594;</p>
              </a>`).join(""));
      } else if (usuario.rol === "produccion") {
        const misReq = items.filter((r) => r["Solicitó"] === usuario.nombre)
          .sort((a, b) => String(b.Fecha).localeCompare(String(a.Fecha)));
        cont.innerHTML = `<p style="font-size:12px;color:var(--gris);margin:20px 0 8px;">Mis requisiciones</p>` +
          (misReq.length === 0
            ? '<p style="font-size:13px;color:var(--gris);">Todavía no has creado ninguna requisición.</p>'
            : misReq.map((r) => `
              <div class="req-item">
                <div class="fila"><span class="reqid">${r.ID}</span><span class="badge badge-${claseEstado(r.Estado)}">${r.Estado}</span></div>
                <p class="op" style="font-weight:600;">${r["Referencia"]} · ${r.Fecha}</p>
                ${detalleRequisicion(r, mod)}
              </div>`).join(""));
      }
    }
    cargarResumen();
  }
</script>
</body>
</html>
