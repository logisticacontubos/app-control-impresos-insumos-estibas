<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva requisición · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" id="backLink" href="modulo.html">&#8592;</a>
    <div>
      <h1 id="titulo">Nueva requisición</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="error-msg" id="formError"></div>
    <form id="formNueva">
      <label id="labelItem">Ítem</label>
      <select id="selCodigo" required></select>
      <p id="stockDisponible" style="font-size:12px;color:var(--gris);margin:-8px 0 12px;"></p>
      <label id="labelCantidad">Cantidad solicitada</label>
      <input type="number" id="inpCantidad" min="0" step="any" required>
      <div id="grupoMotivo" style="display:none;">
        <label>Motivo / para qué se necesita</label>
        <textarea id="inpMotivo" rows="3" placeholder="Ej: Se va a cortar familia, se necesitan 40 estibas 115x115"></textarea>
      </div>
      <button class="btn btn-primary" id="btnEnviar">Enviar a bodega</button>
    </form>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod, empresaActual } = ctx;
    document.getElementById("backLink").href = "modulo.html?modulo=" + mod.key;
    document.getElementById("titulo").textContent = "Nueva requisición";
    document.getElementById("sub").textContent = mod.label;
    document.getElementById("labelItem").textContent = mod.itemLabel;
    document.getElementById("labelCantidad").textContent = "Cantidad solicitada (" + mod.unitLabel + ")";

    if (!puedeCrearRequisicion(usuario.rol)) window.location.href = "modulo.html?modulo=" + mod.key;

    // En Estibas el motivo/uso es obligatorio (ej: "se va a cortar familia,
    // se necesitan 40 estibas 115x115"), para que quede claro a qué necesidad
    // va ligado el pedido.
    const esEstibas = mod.key === "estibas";
    const inpMotivo = document.getElementById("inpMotivo");
    if (esEstibas) {
      document.getElementById("grupoMotivo").style.display = "block";
      inpMotivo.required = true;
    }

    // Clave de intento: se genera UNA sola vez al abrir este formulario, no en
    // cada clic — así, si "Enviar a bodega" falla por un error de red/timeout
    // (Google puede quedarse colgado sirviendo la respuesta aunque la
    // requisición ya se haya guardado) y la persona vuelve a darle clic, el
    // backend reconoce que es el MISMO intento y no crea una segunda
    // requisición duplicada.
    const idempotencia = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("idem-" + Date.now() + "-" + Math.random());

    let itemsInv = [];
    let stockHeader = "";
    async function cargarItems() {
      // Se filtra por la empresa activa (empresaActual) para que, en los
      // módulos donde cada empresa tiene su propio inventario (Insumos,
      // Estibas), no se mezclen en el selector ítems que en realidad son de
      // la otra empresa — eso evitaba que, por error, se pidiera algo que ni
      // siquiera existe en el stock de la empresa con la que se está
      // trabajando ahorita.
      const invData = await apiGet("getInventario", { modulo: mod.key, empresa: empresaActual });
      itemsInv = invData.items || [];
      const codigoHeader = buscarEncabezado(itemsInv[0], "Código");
      const refHeader = buscarEncabezado(itemsInv[0], "Referencia");
      stockHeader = buscarEncabezado(itemsInv[0], "Stock actual");
      const sel = document.getElementById("selCodigo");
      sel.innerHTML = '<option value="">Selecciona…</option>' + itemsInv.map((it) =>
        `<option value="${it[codigoHeader]}" data-ref="${it[refHeader]}">${it[refHeader]}</option>`).join("");
    }
    cargarItems();

    document.getElementById("selCodigo").addEventListener("change", (e) => {
      const codigoHeader = buscarEncabezado(itemsInv[0], "Código");
      const item = itemsInv.find((it) => it[codigoHeader] === e.target.value);
      const stockEl = document.getElementById("stockDisponible");
      if (item && stockHeader && item[stockHeader] !== "" && item[stockHeader] !== undefined) {
        stockEl.textContent = "Disponible en bodega: " + item[stockHeader] + " " + mod.unitLabel;
      } else {
        stockEl.textContent = "";
      }
    });

    document.getElementById("formNueva").addEventListener("submit", async (e) => {
      e.preventDefault();
      ocultarError("formError");
      const sel = document.getElementById("selCodigo");
      const codigo = sel.value;
      const referencia = sel.selectedOptions[0] ? sel.selectedOptions[0].dataset.ref : "";
      const cantidad = document.getElementById("inpCantidad").value;
      const motivo = inpMotivo ? inpMotivo.value.trim() : "";
      if (esEstibas && !motivo) {
        mostrarError("formError", "El motivo es obligatorio para pedidos de estibas.");
        return;
      }
      const btn = document.getElementById("btnEnviar");
      btn.disabled = true;
      try {
        await apiPost("crearRequisicion", {
          modulo: mod.key, codigo, referencia, cantidad, motivo,
          solicito: usuario.nombre, cargo: usuario.cargo,
          idempotencia: idempotencia,
        });
        window.location.href = "modulo.html?modulo=" + mod.key;
      } catch (err) {
        mostrarError("formError", err.message);
        btn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
