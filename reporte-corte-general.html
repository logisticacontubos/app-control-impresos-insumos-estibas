<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte del corte · Control de Impresos - Insumos - Estibas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar no-imprimir">
    <a class="back" id="backLink" href="inventario.html">&#8592;</a>
    <div>
      <h1 id="titulo">Reporte del corte</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <main>
    <div class="encabezado-pdf solo-impresion">
      <img id="logoPdf" src="" alt="">
      <div class="txt">
        <h2 id="tituloPdf">Reporte del corte mensual de inventario</h2>
        <p id="subPdf"></p>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="btn-row no-imprimir" style="margin-bottom:14px;">
      <button class="btn btn-secondary" id="btnExcel">Descargar Excel</button>
      <button class="btn btn-secondary" id="btnPdf">Descargar PDF</button>
    </div>

    <div class="resumen-cg" id="resumenCg"></div>

    <p style="font-size:12px;color:var(--gris);margin:8px 0 8px;" id="tituloDetalle">Detalle completo del corte</p>
    <div id="detalle"></div>

    <div class="solo-impresion" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead>
          <tr style="text-align:left;">
            <th style="padding:6px 7px;border:1px solid var(--borde);">Código</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Referencia</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Sistema</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Contado</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Diferencia</th>
            <th style="padding:6px 7px;border:1px solid var(--borde);">Observación</th>
          </tr>
        </thead>
        <tbody id="tbodyImpresion"></tbody>
      </table>
    </div>

    <div class="pie-pdf solo-impresion" id="piePdf"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
<script>
  const ctx = requiereModulo();
  if (ctx) {
    const { usuario, mod, empresaActual } = ctx;
    const params = new URLSearchParams(window.location.search);
    const loteId = params.get("loteId") || "";
    document.getElementById("backLink").href = "inventario.html?modulo=" + mod.key;
    document.getElementById("sub").textContent = mod.label + " · " + loteId;
    document.getElementById("logoPdf").src = empresaActual === "Tecnipapel" ? "assets/logo-tecnipapel.png" : "assets/logo-contubos.png";

    let datosReporte = null;

    async function cargar() {
      try {
        const datos = await apiGet("getReporteCorteGeneral", { modulo: mod.key, loteId: loteId });
        datosReporte = datos;
        const unit = datos.unitLabel;
        document.getElementById("subPdf").textContent = mod.label + " · " + empresaActual + " · Corte " + loteId + " · generado " + fechaHoy();

        document.getElementById("resumenCg").innerHTML = `
          <div class="stat"><p class="l">Ítems contados</p><p class="v">${datos.itemsTotales}</p></div>
          <div class="stat dif"><p class="l">Con diferencia</p><p class="v">${datos.itemsConDiferencia}</p></div>
          <div class="stat neto" style="grid-column:span 2;"><p class="l">Ajuste neto</p><p class="v">${datos.ajusteNeto > 0 ? "+" : ""}${datos.ajusteNeto} ${unit}</p></div>
        `;

        // Se muestran TODOS los ítems contados (no solo los que tuvieron
        // diferencia) — cada tarjeta trae sistema, contado y diferencia; la
        // insignia cambia de color/texto solo para que las diferencias
        // resalten dentro de la lista completa, no para ocultar el resto.
        document.getElementById("detalle").innerHTML = datos.detalle.length === 0
          ? '<p style="font-size:13px;color:var(--gris);">Este corte no tiene ítems registrados.</p>'
          : datos.detalle.map((d) => {
              const dif = Number(d.diferencia) || 0;
              // Mismos 3 colores que ya usa el resto de la app (verde/ámbar/
              // rojo): faltante (negativo) en rojo porque es la más seria
              // -inventario de menos-, sobrante (positivo) en ámbar, y sin
              // diferencia en verde — así las diferencias resaltan de un
              // vistazo dentro de la lista completa.
              const claseBadge = dif < 0 ? "Crítico" : dif > 0 ? "Ajustado" : "Óptimo";
              const textoBadge = dif === 0 ? "Sin diferencia" : (dif > 0 ? "+" : "") + dif + " " + unit;
              return `
              <div class="req-item">
                <div class="fila">
                  <span class="reqid" style="font-size:14px;">${d.referencia || d.codigo}</span>
                  <span class="badge badge-${claseBadge}">${textoBadge}</span>
                </div>
                <p class="op">${d.codigo} · sistema ${d.cantidadSistema} &#8594; contado ${d.cantidadContada}</p>
                ${d.observacion ? `<p class="op">${d.observacion}</p>` : ""}
              </div>`;
            }).join("");

        const celda = (v) => `<td style="padding:6px 7px;border:1px solid var(--borde);">${v}</td>`;
        document.getElementById("tbodyImpresion").innerHTML = datos.detalle.length === 0
          ? `<tr><td colspan="6" style="padding:10px;border:1px solid var(--borde);color:var(--gris);">Este corte no tiene ítems registrados.</td></tr>`
          : datos.detalle.map((d) => {
              const dif = Number(d.diferencia) || 0;
              // Mismo criterio de color que las tarjetas de pantalla, para que
              // el PDF/impresión resalte igual las diferencias.
              const colorDif = dif < 0 ? "var(--rojo)" : dif > 0 ? "var(--ambar)" : "var(--verde)";
              const celdaDif = `<td style="padding:6px 7px;border:1px solid var(--borde);color:${colorDif};font-weight:700;">${dif === 0 ? "0" : (dif > 0 ? "+" : "") + dif}</td>`;
              return "<tr>" +
                celda(d.codigo || "") + celda(d.referencia || "") + celda(d.cantidadSistema) + celda(d.cantidadContada) +
                celdaDif + celda(d.observacion || "") + "</tr>";
            }).join("");

        document.getElementById("piePdf").textContent =
          "Generado por " + usuario.nombre + " (" + usuario.rol + ") · " + fechaHoy() + " " + horaActual() + " · " + window.location.hostname;

        // Si se llegó aquí desde el acceso directo "Ver/imprimir último
        // reporte" (inventario.html agrega &imprimir=1 al enlace), se abre el
        // diálogo de impresión solo, sin que la persona tenga que buscar y
        // darle clic a "Descargar PDF" aparte. El pequeño retraso deja que el
        // navegador termine de pintar la tabla/encabezado de impresión antes
        // de abrir el diálogo.
        if (params.get("imprimir") === "1") {
          setTimeout(() => window.print(), 300);
        }
      } catch (err) {
        document.getElementById("errorMsg").textContent = err.message;
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    document.getElementById("btnExcel").addEventListener("click", () => {
      if (!datosReporte) return;
      const wb = XLSX.utils.book_new();
      const filas = [
        ["Reporte del corte mensual de inventario", mod.label, empresaActual, loteId],
        ["Ítems contados", datosReporte.itemsTotales, "Con diferencia", datosReporte.itemsConDiferencia, "Ajuste neto", datosReporte.ajusteNeto],
        [],
        ["Código", "Referencia", "Sistema", "Contado", "Diferencia", "Observación"],
        ...datosReporte.detalle.map((d) => [d.codigo, d.referencia, d.cantidadSistema, d.cantidadContada, d.diferencia, d.observacion || ""]),
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filas), "Corte");
      XLSX.writeFile(wb, `Corte_${loteId}_${fechaHoy()}.xlsx`);
    });

    document.getElementById("btnPdf").addEventListener("click", () => window.print());

    cargar();
  }
</script>
</body>
</html>
